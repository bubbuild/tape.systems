name: Landing dependency duty

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [dependabot_alert]
  workflow_run:
    workflows: [Dependency checks]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  vulnerability-alerts: read

jobs:
  duty:
    if: >-
      vars.LANDING_MODEL != '' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'repository_dispatch' && github.event.action == 'dependabot_alert') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch != github.event.repository.default_branch)) &&
        github.event.workflow_run.conclusion == 'failure' && vars.LANDING_BUMP_ON_FAILURE != 'false'))
    concurrency:
      group: landing-dependencies-${{ github.repository_id }}-${{ github.event.client_payload.alert_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || 'maintenance' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
      GIT_AUTHOR_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_AUTHOR_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_COMMITTER_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
    steps:
      # Always prepare trusted default-branch tools, never a failed PR's checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: 2.102.0
          github-token: ${{ env.GH_TOKEN }}
      - name: Prepare GitHub Git authentication
        run: |
          git var GIT_AUTHOR_IDENT
          git var GIT_COMMITTER_IDENT
          gh auth setup-git
      - name: Read Landing dependency publishing identity
        if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'deps/landing-')
        run: echo "LANDING_PUBLISHING_ACTOR=$(gh api graphql -f query='{viewer{login}}' --jq .data.viewer.login)" >> "$GITHUB_ENV"
      - name: Maintain dependencies
        uses: bubbuild/landing@9014baa64f82893dc194a3f1e31391737f68c426
        env:
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
        with:
          command: bump
          trust: repository
          upstream-workflow: Dependency checks
          bump-on-failure: ${{ vars.LANDING_BUMP_ON_FAILURE || 'true' }}
          dependency-update-actors: |
            dependabot[bot]
            renovate[bot]
            ${{ env.LANDING_PUBLISHING_ACTOR }}
            ${{ vars.LANDING_DEPENDENCY_UPDATE_ACTORS }}
          checked-revision: ${{ github.event_name != 'workflow_run' && github.sha || '' }}
          delivery-key: ${{ github.event_name != 'workflow_run' && format('dependencies:{0}', github.run_id) || '' }}
          instruction: >-
            Maintain only this repository's dependencies and open security alerts; scope work to the supplied candidate or alert when present.
            Use an isolated candidate checkout and pnpm 10. Preserve manifest pinning style and keep package.json and pnpm-lock.yaml consistent.
            Follow the existing Pages build environment (Node 20). Validate with pnpm install --frozen-lockfile and pnpm build in the candidate checkout.
            Reuse existing dependency PRs; publish new updates only as draft PRs on fresh deps/landing-* branches.
            Repair only the supplied dependency PR after its current independent Dependency checks run fails; append commits to its original branch and preserve draft status.
            Start independent CI with gh workflow run dependency-checks.yml --ref <candidate-branch> and inspect the matching head's result before claiming success.
            Track confirmed security blockers in a matching issue only when useful. Do not perform general review, triage, deployment repair, or unrelated cleanup.
            Maintainers decide merge and alert dismissal; never merge or dismiss alerts.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 14
          if-no-files-found: ignore
