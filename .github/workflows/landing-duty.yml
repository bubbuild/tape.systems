name: Landing dependency duty

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [dependabot_alert]
  workflow_run:
    workflows: [Dependency checks]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  vulnerability-alerts: read

jobs:
  duty:
    if: >-
      vars.LANDING_MODEL != '' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch != github.event.repository.default_branch)) &&
        github.event.workflow_run.conclusion == 'failure' && vars.LANDING_BUMP_ON_FAILURE != 'false'))
    concurrency:
      group: landing-dependencies-${{ github.repository_id }}-${{ github.event.client_payload.alert_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || 'maintenance' }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
      GIT_AUTHOR_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_AUTHOR_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_NAME: ${{ vars.LANDING_GIT_NAME || 'github-actions[bot]' }}
      GIT_COMMITTER_EMAIL: ${{ vars.LANDING_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: 2.102.0
          github-token: ${{ env.GH_TOKEN }}
      - name: Prepare GitHub Git authentication
        run: gh auth setup-git
      - name: Read Landing dependency publishing identity
        if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'deps/landing-')
        run: echo "LANDING_PUBLISHING_ACTOR=$(gh api graphql -f query='{viewer{login}}' --jq .data.viewer.login)" >> "$GITHUB_ENV"
      - name: Maintain dependencies
        uses: bubbuild/landing@main
        env:
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: '120'
        with:
          command: bump
          upstream-workflow: Dependency checks
          bump-on-failure: ${{ vars.LANDING_BUMP_ON_FAILURE || 'true' }}
          dependency-update-actors: |
            dependabot[bot]
            renovate[bot]
            ${{ env.LANDING_PUBLISHING_ACTOR }}
            ${{ vars.LANDING_DEPENDENCY_UPDATE_ACTORS }}
          checked-revision: ${{ github.event_name != 'workflow_run' && github.sha || '' }}
          instruction: >-
            Maintain dependencies with pnpm 10 and Node 20 in an isolated checkout; preserve pinning and lockfile consistency.
            Reuse existing PRs; create new updates as drafts on deps/landing-* branches. Repair only the supplied failed dependency PR on its existing branch, preserving draft status.
            Validate with pnpm install --frozen-lockfile and pnpm build; dispatch gh workflow run dependency-checks.yml --ref <candidate-branch> and verify its head's result.
            Scope work to dependencies and supplied alerts, including closed-alert reconciliation. No general review/triage, merging, or alert dismissal.
